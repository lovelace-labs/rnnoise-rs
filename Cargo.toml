[package]
name = "rnnoise-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "BSD-3-Clause"
description = "Idiomatic Rust port of Xiph RNNoise (current conv+GRU model) for real-time speech noise suppression"
repository = "https://github.com/lovelace-labs/rnnoise-rs"
readme = "README.md"
keywords = ["rnnoise", "denoise", "noise", "audio", "dsp"]
categories = ["multimedia::audio", "science"]
exclude = ["bup", "scripts"]
homepage = "https://github.com/lovelace-labs/rnnoise-rs"
documentation = "https://docs.rs/rnnoise-rs"
authors = ["lovelace-labs"]
[lib]
name = "rnnoise"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
# Expose a C ABI matching rnnoise.h (DenoiseState / rnnoise_process_frame ...).
capi = []
# Also bundle the original (2018) RNNoise model: a smaller, faster, lower-quality
# pipeline exposed as `DenoiseStateV1` (adds ~85 KB of embedded weights). Uses
# `realfft` (rustfft) for the front-end FFT — the same fast FFT `nnnoiseless`
# uses — so the legacy model is faster than `nnnoiseless`.
legacy-model = ["dep:realfft"]
# Opt-in, dev/CI only: honours `RNNOISE_SIMD_TIER` in a normal build so a specific
# kernel path can be exercised and measured. Costs one cached lookup per matmul call,
# so it is never enabled by default and never part of the shipping API.
simd-tier-override = []

[dependencies]
realfft = { version = "3", optional = true }

[dev-dependencies]
# Benchmark harness for `cargo bench`: the CI job saves a baseline and
# uploads the JSON as an artifact. Dev-only, so it never reaches a crate user.
criterion = "0.5"

[[bin]]
name = "rnnoise-demo"
path = "src/bin/rnnoise_demo.rs"

[[bench]]
name = "process"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Unsafe code is confined to the SIMD, FFT and C ABI modules, which opt in with
# `#[allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
